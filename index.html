<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/style.css">

<body class="page-void">
  <canvas id="neural-net" aria-hidden="true"></canvas>

  <main class="void">

        <span class="brand-sub-en">Create &amp; Observe</span>

    <nav class="duo" aria-label="Primary">
      <a class="duo-card" href="/create.html" data-card="create">

                fill="none"
                stroke="currentColor"
                stroke-width="1"
                vector-effect="non-scaling-stroke"/>

        <div class="card-body">
          <span class="card-eyebrow">01 / Create</span>
          <h2 class="card-title">CREATE</h2>
          <p class="card-line">Turning ideas into reality.</p>

          <span class="card-go">enter <i class="arrow">→</i></span>

      </a>

      <a class="duo-card" href="/observe.html" data-card="observe">
        <svg class="card-frame" viewBox="0 0 100 70" preserveAspectRatio="none" aria-hidden="true">
          <path class="card-frame-path"

                stroke="currentColor"
                stroke-width="1"
                vector-effect="non-scaling-stroke"/>

        <div class="card-body">
          <span class="card-eyebrow">02 / Observe</span>

        </div>

    <footer class="void-foot">
      <span class="void-foot-line">a silent digital universe</span>
      <span class="void-foot-meta">
        <a href="/about.html">about</a>

        <a href="https://github.com/tance-mang" target="_blank" rel="noopener">github</a>
